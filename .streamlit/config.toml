[theme]
base = "light"
primaryColor = "#177FD1"
backgroundColor = "#F4F7F9"
secondaryBackgroundColor = "#FFFFFF"
textColor = "#17212B"
font = "sans serif"

[client]
showErrorDetails = "type"
toolbarMode = "minimal"

[server]
# The factory uses Transformers/sentence-transformers, whose optional vision
# modules can trigger noisy Streamlit watcher imports when torchvision is absent.
# The app does not need hot-reload file watching in production.
fileWatcherType = "none"
