name: One-time visual import repair

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Replace stale visual pipeline imports
        shell: python
        run: |
          from pathlib import Path

          replacement = "from visual_content_runtime import patch_content_first_visuals as patch_visual_pipeline"
          stale = "from visual_runtime import patch_visual_pipeline"

          for name in ("app.py", "pages/Test_Phase.py"):
              path = Path(name)
              if not path.exists():
                  continue
              text = path.read_text(encoding="utf-8")
              updated = text.replace(stale, replacement)
              if updated != text:
                  path.write_text(updated, encoding="utf-8")

      - name: Commit repair and remove this one-time workflow
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm -f .github/workflows/repair_visual_import.yml
          git add app.py pages/Test_Phase.py
          if git diff --cached --quiet; then
            echo "No stale import changes were needed."
            exit 0
          fi
          git commit -m "Fix stale visual pipeline imports"
          git push