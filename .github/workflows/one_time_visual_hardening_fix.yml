name: One-time visual hardening repair

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/one_time_visual_hardening_fix.yml'

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Remove legacy six-query visual planner
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          p = Path('production_hardening_runtime.py')
          text = p.read_text(encoding='utf-8')

          pattern = re.compile(
              r'\ndef _install_authoritative_visual_query_planner\(\) -> None:\n.*?\n\ndef _enrich_emergency_story\(',
              re.DOTALL,
          )

          replacement = '''\ndef _install_authoritative_visual_query_planner() -> None:\n    """Preserve the immutable one-query visual planner; never restore a legacy query ladder."""\n    try:\n        import visual_strategy_runtime\n        current = getattr(visual_strategy_runtime, "build_deep_queries", None)\n\n        if getattr(current, "_authoritative_locked_subject_planner", False):\n            print(\n                "   [Visual Strategy Hardening] Strict single-query visual planner preserved; legacy multi-query hardening skipped.",\n                flush=True,\n            )\n            return\n\n        # Recovery path only: ask the real visual lock runtime to install the\n        # authoritative planner. This function must never construct its own\n        # multi-query planner.\n        from visual_query_lock_runtime import install\n        install()\n        current = getattr(visual_strategy_runtime, "build_deep_queries", None)\n        if not getattr(current, "_authoritative_locked_subject_planner", False):\n            raise RuntimeError("authoritative one-query visual planner could not be installed")\n        print(\n            "   [Visual Strategy Hardening] Strict single-query visual planner installed.",\n            flush=True,\n        )\n    except Exception as exc:\n        print(\n            f"   [Visual Strategy Hardening] Strict planner check failed: {type(exc).__name__}: {exc}",\n            flush=True,\n        )\n\n\ndef _enrich_emergency_story('''

          updated, count = pattern.subn(replacement, text, count=1)
          if count != 1:
              raise SystemExit(f'Expected exactly one legacy planner block, found {count}')

          p.write_text(updated, encoding='utf-8')
          PY
          python -m py_compile production_hardening_runtime.py

      - name: Commit repair and remove this workflow
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add production_hardening_runtime.py
          git commit -m 'fix: remove legacy multi-query visual planner'
          git rm .github/workflows/one_time_visual_hardening_fix.yml
          git commit -m 'chore: remove one-time visual hardening repair workflow'
          git push origin HEAD:main
