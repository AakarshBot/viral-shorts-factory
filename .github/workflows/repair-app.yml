name: Repair app.py from last known-good commit

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  repair:
    if: github.event.head_commit.message != 'fix: restore dashboard after accidental app truncation'
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Restore app.py and add visual runtime import
        run: |
          git checkout d50b0329c337c1205f4c6f5186ec380b12d12db0 -- app.py
          python - <<'PY'
          from pathlib import Path
          p = Path('app.py')
          text = p.read_text(encoding='utf-8')
          old = 'from visual_runtime import patch_visual_pipeline\n'
          new = old + 'import visual_runtime\n'
          if 'import visual_runtime\n' not in text:
              text = text.replace(old, new, 1)
          p.write_text(text, encoding='utf-8')
          PY
          python -m py_compile app.py

      - name: Commit repaired app.py
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app.py
          git commit -m 'fix: restore dashboard after accidental app truncation'
          git push origin HEAD:main
