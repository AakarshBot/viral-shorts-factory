name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  merge_group:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: CI
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pytest

      - name: Compile supported Python sources
        run: python -m compileall -q .

      - name: Validate canonical dashboard syntax
        run: python -m py_compile app.py

      - name: Import supported runtime modules
        run: |
          python - <<'PY'
          import audio_direction_runtime, audio_runtime, autopilot_runtime
          import branding_runtime, db_architecture, db_runtime, diagnostics_runtime, evidence_runtime
          import editorial_runtime, factory_runtime, final_qc_runtime, learning_runtime
          import image_sources_runtime, provider_runtime, quality_runtime, research_runtime
          import runtime_bindings, runtime_hardener, production_hardening_runtime
          import script_guard_runtime, script_runtime, semantic_runtime, story_ranker
          import subtitle_runtime, ultimate_bot, visual_content_runtime, visual_qa_runtime
          import visual_runtime, visual_safety_runtime, visual_strategy_runtime
          import visual_semantic_guard_runtime, visual_query_entities_runtime
          import visual_retrieval_runtime, visual_provider_boundary_runtime, workflow_runtime
          import youtube_comment_runtime
          print('Supported runtime imports passed.')
          PY

      - name: Run no-API diagnostics
        run: |
          python - <<'PY'
          import sys
          sys.excepthook = sys.__excepthook__
          from diagnostics_runtime import run_offline_diagnostics
          report = run_offline_diagnostics()
          for item in report['results']:
              print(f"[{item['status']}] {item['name']}: {item['detail']}")
          assert report['api_calls'] == 0
          assert report['all_passed'], report
          print(f"Offline diagnostics passed: {report['passed']}/{report['total']}")
          PY

      - name: Run repository regression tests
        run: python -m pytest -q --durations=20 --durations-min=1
