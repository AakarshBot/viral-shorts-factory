name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  merge_group:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: CI
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: python -m pip install --upgrade pip && python -m pip install -r requirements.txt

      - name: Compile Python sources
        run: python -m compileall -q .

      - name: Import core runtime modules
        run: |
          python - <<'PY'
          import audio_runtime
          import autopilot_runtime
          import db_architecture
          import db_runtime
          import diagnostics_runtime
          import editorial_runtime
          import factory_runtime
          import learning_runtime
          import provider_runtime
          import quality_runtime
          import runtime_bindings
          import script_runtime
          import semantic_runtime
          import story_ranker
          import ultimate_bot
          import visual_runtime
          import visual_qa_runtime
          import visual_strategy_runtime
          import visual_content_runtime
          import youtube_comment_runtime
          print('Core runtime imports passed.')
          PY

      - name: Run offline runtime smoke checks
        run: |
          python - <<'PY'
          import inspect
          import edge_tts
          import factory_runtime
          import provider_runtime
          import runtime_bindings
          import ultimate_bot
          import visual_qa_runtime
          import visual_runtime
          import visual_strategy_runtime
          import youtube_comment_runtime

          signature = inspect.signature(edge_tts.Communicate)
          assert 'boundary' in signature.parameters, signature

          vignette = factory_runtime._vignette((1080, 1920))
          assert vignette.size == (1080, 1920)

          person = {'primary_entity': 'Lionel Messi', 'visual_intent': 'person portrait', 'voiceover': 'Lionel Messi scored in the final.', 'sport_or_topic_category': 'football'}
          event = {'primary_entity': 'FIFA World Cup final', 'visual_intent': 'actual match event', 'voiceover': 'The final decided the champion.', 'sport_or_topic_category': 'football'}
          concept = {'primary_entity': 'quantum computing', 'visual_intent': 'technical process', 'voiceover': 'Quantum computers use quantum states to process information.', 'sport_or_topic_category': 'technology'}
          assert visual_strategy_runtime.classify_scene(person) == 'PERSON'
          assert visual_strategy_runtime.classify_scene(event) == 'EVENT'
          assert visual_strategy_runtime.classify_scene(concept) in {'PROCESS', 'CONCEPT'}
          queries, visual_type = visual_strategy_runtime.build_deep_queries(person, 'Messi story')
          assert visual_type == 'PERSON'
          assert 3 <= len(queries) <= 6
          assert len(queries) < 10
          assert any('official photo' in q.lower() for q in queries)
          assert not any('editorial_person' in q.lower() for q in queries)

          from visual_qa_runtime import _tier_for
          from visual_runtime import _cache_key, _context_fingerprint
          assert _tier_for('person portrait', 'PERSON', 'Wikipedia') == 'CURATED_PERSON'
          assert _tier_for('person portrait', 'PERSON', 'DDG') == 'STRICT'
          assert _tier_for('stadium_event', 'EVENT', 'DDG') == 'GENRE_PLAUSIBLE_EVENT'
          assert _tier_for('conceptual', 'GENERAL_CONTEXT', 'DDG') == 'SKIPPED_CONCEPTUAL'
          c1 = _context_fingerprint('person portrait', 'Messi World Cup final', 'Messi scored in the final', 'Messi story')
          c2 = _context_fingerprint('person portrait', 'Messi training', 'Messi trained before the match', 'Messi story')
          assert c1 != c2
          assert _cache_key('Lionel Messi', 'PERSON', c1) != _cache_key('Lionel Messi', 'PERSON', c2)

          factory_runtime.patch_dashboard_runtime(ultimate_bot)
          provider_runtime.patch_provider_adapters(ultimate_bot)
          runtime_bindings.harden_editorial_defaults(ultimate_bot)
          runtime_bindings.bind_dashboard_patches(ultimate_bot)
          namespace = ultimate_bot.run_robot.__globals__
          for name in (
              'gather_and_filter_stories', 'editorial_gate_batch',
              'process_scored_candidates', 'validate_script',
              'generate_voiceover_and_timestamps', 'process_visuals_async',
              'fetch_scene_asset', 'token_overlap_ratio', 'upload_to_youtube'
          ):
              assert namespace[name] is getattr(ultimate_bot, name), name

          assert getattr(ultimate_bot.get_trend_signal_bonus, '_cached_trend_signal', False)
          rejected = [{'hard_reject': True, 'monetization_risk': 9}]
          batch = [{'title': 'Rejected story', 'genre': 'technology'}]
          result = ultimate_bot.process_scored_candidates(rejected, batch, {}, None, 'regular')
          assert result == [], result

          cleaned_title, description, tags = youtube_comment_runtime._build_clean_metadata(
              {'title': 'Example Story #shorts', 'seo_description': 'A factual summary.', 'tags': ['AI']},
              {'label': 'Tech', 'hashtags': ['#Tech'], 'category_id': '28'},
              None,
          )
          assert '#shorts' not in cleaned_title.lower(), cleaned_title
          comment = youtube_comment_runtime.build_pinned_comment(
              {'pinned_comment': 'What do you think this means for the industry?'},
              cleaned_title,
          )
          assert '?' in comment
          assert 'subscribe' in comment.lower()
          assert getattr(ultimate_bot.fetch_hf_ai_image, '__name__', '') == 'hf_text_to_image'

          print('Offline runtime smoke checks passed.')
          PY

      - name: Run full no-API diagnostics
        run: |
          python - <<'PY'
          from diagnostics_runtime import run_offline_diagnostics
          report = run_offline_diagnostics()
          for item in report['results']:
              print(f"[{item['status']}] {item['name']}: {item['detail']}")
          assert report['api_calls'] == 0
          assert report['all_passed'], report
          print(f"Full no-API diagnostics passed: {report['passed']}/{report['total']}")
          PY

      - name: Validate required factory files
        run: |
          python - <<'PY'
          from pathlib import Path
          required = [
              'app.py',
              'ultimate_bot.py',
              'audio_runtime.py',
              'visual_runtime.py',
              'visual_qa_runtime.py',
              'visual_strategy_runtime.py',
              'visual_content_runtime.py',
              'quality_runtime.py',
              'factory_runtime.py',
              'db_architecture.py',
              'db_runtime.py',
              'diagnostics_runtime.py',
              'learning_runtime.py',
              'autopilot_runtime.py',
              'story_ranker.py',
              'semantic_runtime.py',
              'runtime_bindings.py',
              'provider_runtime.py',
              'editorial_runtime.py',
              'script_runtime.py',
              'youtube_comment_runtime.py',
              'requirements.txt',
          ]
          missing = [path for path in required if not Path(path).is_file()]
          if missing:
              raise SystemExit(f'Missing required files: {missing}')
          print(f'Validated {len(required)} required factory files.')
          PY
