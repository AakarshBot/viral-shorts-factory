name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  merge_group:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: CI
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: python -m pip install --upgrade pip && python -m pip install -r requirements.txt

      - name: Compile Python sources
        run: python -m compileall -q .

      - name: Explicitly validate dashboard syntax
        run: python -m py_compile app.py newsroom_dashboard.py pages/Factory_QC.py

      - name: Import core runtime modules
        run: |
          python - <<'PY'
          import audio_direction_runtime, audio_runtime, autopilot_runtime
          import branding_runtime, db_architecture, db_runtime, diagnostics_runtime
          import editorial_runtime, factory_runtime, final_qc_runtime, learning_runtime
          import provider_runtime, quality_runtime, research_runtime, runtime_bindings
          import script_guard_runtime, script_runtime, semantic_runtime, story_ranker
          import subtitle_runtime, ultimate_bot, visual_content_runtime, visual_qa_runtime
          import visual_runtime, visual_safety_runtime, visual_strategy_runtime, workflow_runtime, youtube_comment_runtime
          import newsroom_dashboard
          print('Core runtime imports passed.')
          PY

      - name: Run offline runtime smoke checks
        run: |
          python - <<'PY'
          import inspect
          import edge_tts
          import factory_runtime, final_qc_runtime, provider_runtime, runtime_bindings
          import runtime_hardener, script_guard_runtime, ultimate_bot, visual_qa_runtime, visual_runtime, visual_safety_runtime
          import visual_strategy_runtime, workflow_runtime, youtube_comment_runtime
          import visual_policy_runtime

          assert 'boundary' in inspect.signature(edge_tts.Communicate).parameters
          assert factory_runtime._vignette((1080, 1920)).size == (1080, 1920)

          visual_policy_runtime.install_visual_card_policy(ultimate_bot)
          contract_errors = runtime_hardener.validate_runtime_contracts(ultimate_bot)
          assert not contract_errors, contract_errors
          assert visual_runtime.VISUAL_MAX_SEARCH_QUERIES == visual_safety_runtime.VISUAL_MAX_SEARCH_QUERIES
          assert visual_runtime.VISUAL_MAX_VERIFICATION_ATTEMPTS == visual_safety_runtime.VISUAL_MAX_VERIFICATION_ATTEMPTS
          assert visual_qa_runtime.GEMINI_VISUAL_MAX_REQUESTS == visual_safety_runtime.GEMINI_VISUAL_MAX_REQUESTS
          assert visual_qa_runtime.GEMINI_VISUAL_MAX_REQUESTS_PER_SCENE == visual_safety_runtime.GEMINI_VISUAL_MAX_REQUESTS_PER_SCENE
          assert getattr(visual_runtime, 'VISUAL_BUDGET_RUNTIME_VERSION', '') == '2026-09-17-v1'

          person = {'primary_entity': 'Lionel Messi', 'visual_intent': 'person portrait', 'voiceover': 'Lionel Messi scored in the final.', 'sport_or_topic_category': 'football'}
          event = {'primary_entity': '2022 FIFA World Cup Final', 'visual_intent': 'actual match event', 'voiceover': 'The final went to penalties.', 'sport_or_topic_category': 'football'}
          bcci = {'primary_entity': 'BCCI', 'visual_intent': 'organization', 'voiceover': 'BCCI announced the decision.', 'sport_or_topic_category': 'cricket'}
          delhi = {'primary_entity': 'Delhi', 'visual_intent': 'location', 'voiceover': 'Delhi hosted the event.', 'sport_or_topic_category': 'news'}
          concept = {'primary_entity': 'quantum computing', 'visual_intent': 'technical process', 'voiceover': 'Quantum computers use quantum states to process information.', 'sport_or_topic_category': 'technology'}

          assert visual_strategy_runtime.classify_scene(person) == 'PERSON'
          assert visual_strategy_runtime.classify_scene(event) == 'EVENT'
          assert visual_strategy_runtime.classify_scene(bcci) == 'ORGANIZATION'
          assert visual_strategy_runtime.classify_scene(delhi) == 'LOCATION'
          assert visual_strategy_runtime.classify_scene(concept) in {'PROCESS', 'CONCEPT'}

          queries, visual_type = visual_strategy_runtime.build_deep_queries(person, 'Messi story')
          assert visual_type == 'PERSON'
          assert queries == ['Lionel Messi'], queries
          event_queries, event_type = visual_strategy_runtime.build_deep_queries(event, 'Argentina vs France')
          assert event_type == 'EVENT'
          assert event_queries == ['2022 FIFA World Cup Final'], event_queries
          assert visual_strategy_runtime.build_deep_queries(bcci, 'BCCI story')[0] == ['BCCI']
          assert visual_strategy_runtime.build_deep_queries(delhi, 'Delhi story')[0] == ['Delhi']

          assert script_guard_runtime.looks_like_instructional_narration('Return only a valid JSON object with voiceover and primary_entity fields.') is True
          assert script_guard_runtime.looks_like_instructional_narration('Sachin Tendulkar scored 143 in the match.') is False
          assert callable(script_guard_runtime.install)

          from visual_qa_runtime import _tier_for
          from visual_runtime import _cache_key, _context_fingerprint
          assert _tier_for('person portrait', 'PERSON', 'Wikipedia') == 'CURATED_PERSON'
          assert _tier_for('person portrait', 'PERSON', 'DDG') == 'STRICT'
          assert _tier_for('stadium_event', 'EVENT', 'DDG') == 'GENRE_PLAUSIBLE_EVENT'
          assert _tier_for('conceptual', 'GENERAL_CONTEXT', 'DDG') == 'SKIPPED_CONCEPTUAL'
          c1 = _context_fingerprint('person portrait', 'Messi World Cup final', 'Messi scored in the final', 'Messi story')
          c2 = _context_fingerprint('person portrait', 'Messi training', 'Messi trained before the match', 'Messi story')
          assert c1 != c2
          assert _cache_key('Lionel Messi', 'PERSON', c1) != _cache_key('Lionel Messi', 'PERSON', c2)

          factory_runtime.patch_dashboard_runtime(ultimate_bot)
          provider_runtime.patch_provider_adapters(ultimate_bot)
          runtime_bindings.harden_editorial_defaults(ultimate_bot)
          runtime_bindings.bind_dashboard_patches(ultimate_bot)
          namespace = ultimate_bot.run_robot.__globals__
          for name in ('gather_and_filter_stories', 'editorial_gate_batch', 'process_scored_candidates', 'validate_script', 'generate_voiceover_and_timestamps', 'process_visuals_async', 'fetch_scene_asset', 'token_overlap_ratio', 'upload_to_youtube', 'generate_karaoke_clip', 'compile_video', 'write_script'):
              assert namespace[name] is getattr(ultimate_bot, name), name

          uploader_signature = inspect.signature(ultimate_bot.upload_to_youtube)
          for name in ('title_override', 'description_override', 'comment_override'):
              assert name in uploader_signature.parameters

          assert callable(final_qc_runtime.validate_final_video)
          assert callable(final_qc_runtime.validate_final_upload_metadata)
          clean_title, clean_description, clean_comment = final_qc_runtime.validate_final_upload_metadata('Example story title', 'This is a factual description with enough words to satisfy final upload quality control checks.', 'What do you think about this story?')
          assert clean_title == 'Example story title'
          assert clean_description.startswith('This is a factual description')
          assert clean_comment.startswith('What do you think')

          assert workflow_runtime.WORKFLOW_VERSION.startswith('2026-09-16-newsroom-')
          assert set(workflow_runtime.FORMAT_OPTIONS) == {'Deep Dive', 'Top-5', 'Cricket'}
          assert set(workflow_runtime.CRICKET_CATEGORIES) == {'India / Asia', 'Global', 'AI-assisted top story in cricket'}

          from pathlib import Path
          required = ['app.py', 'ultimate_bot.py', 'script_guard_runtime.py', 'script_runtime.py', 'visual_runtime.py', 'visual_qa_runtime.py', 'visual_strategy_runtime.py', 'visual_content_runtime.py', 'workflow_runtime.py', 'newsroom_dashboard.py', 'pages/Factory_QC.py', 'final_qc_runtime.py', 'requirements.txt']
          missing = [p for p in required if not Path(p).is_file()]
          assert not missing, missing
          print('Offline runtime smoke checks passed.')
          PY

      - name: Run full no-API diagnostics
        run: |
          python - <<'PY'
          import sys
          # CI must never invoke ultimate_bot's interactive exception hook.
          sys.excepthook = sys.__excepthook__
          from diagnostics_runtime import run_offline_diagnostics
          report = run_offline_diagnostics()
          for item in report['results']:
              print(f"[{item['status']}] {item['name']}: {item['detail']}")
          assert report['api_calls'] == 0
          assert report['all_passed'], report
          print(f"Full no-API diagnostics passed: {report['passed']}/{report['total']}")
          PY
