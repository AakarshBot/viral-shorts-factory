name: Visual Provider Regression

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  regression:
    name: Raw provider boundary
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: python -m pip install --upgrade pip && python -m pip install -r requirements.txt

      - name: Compile visual provider boundary
        run: python -m py_compile visual_provider_boundary_runtime.py visual_retrieval_runtime.py test_visual_provider_boundary.py

      - name: Run offline provider boundary regression
        run: python test_visual_provider_boundary.py
